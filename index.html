<div class="carousel-container">
  <div class="carousel-track">
    <!-- Slide 1 (Active by default) -->
    <section class="slide slide-1 active">Section 1</section>
    <!-- Slide 2 (Next slide) -->
    <section class="slide slide-2 next">Section 2</section>
    <!-- Slide 3 (Previous slide) -->
    <section class="slide slide-3 prev">Section 3</section>
  </div>

  <!-- Navigation Controls -->
  <div class="carousel-nav">
    <button onclick="changeSlide(-1)">❮ Prev</button>
    <button onclick="changeSlide(1)">Next ❯</button>
  </div>
</div>
